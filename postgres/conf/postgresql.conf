# =============================================================================
# Observer · PostgreSQL 18
# Розраховано на: 4 ГБ RAM на сервері, ~40 одночасних сесій студентів,
# навчальні БД до 50 МБ. Обґрунтування кожної цифри — docs/06-sizing.md.
# =============================================================================

listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'

# --- зʼєднання ---------------------------------------------------------------
# 40 студентів у піку × CONNECTION LIMIT 3 = 120 бекендів у стелі, плюс
# obs_app (20) + obs_shipper (4) + obs_provisioner (4) + резерв (5).
# Реальний стелаж тримає pgproxy: понад PROXY_MAX_BACKENDS=100 він черзує,
# а не відкриває нові зʼєднання. Див. docs/06-sizing.md.
max_connections = 140
superuser_reserved_connections = 5
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10

# --- памʼять -----------------------------------------------------------------
# Бюджет: 4 ГБ мінус ОС (~300 МБ), front (~200 МБ), pgproxy (~150 МБ), caddy.
# Сукупний обсяг живих даних усіх студентів — сотні МБ (50 МБ × квота, і бази
# майже ніколи не заповнені). 512 МБ кешують практично весь гарячий набір,
# а звільнена памʼять іде бекендам, яких може бути до 140.
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
temp_buffers = 8MB
# Найнебезпечніший параметр при 120 зʼєднаннях: він множиться на кількість
# сортувань, а не на кількість сесій. При БД у 50 МБ 4 МБ вистачає з запасом.
work_mem = 4MB

# Стеля тимчасових файлів НА КОЖЕН БЕКЕНД. Персональні ліміти студента (64 МБ)
# і обслуговувача накладені через ALTER ROLE, але воркерам АВТОВАКУУМУ роль не
# призначиш — а саме вони виконують ANALYZE, тобто обчислюють вирази
# функціональних індексів студента. Функція з брехливим IMMUTABLE
# матеріалізує стільки, скільки їй дадуть: заміряно 817 МБ за 22 с (аудит З15б,
# F1). Глобальне значення — єдиний спосіб накрити цей шлях.
# ЧОМУ 768 МБ. Знизу межу задає найважчий ЧЕСНИЙ запит obs_app —
# дослідницький вивантаж журналу (front/app/export.py): сортування з
# sql_text коштує ~380 байт на рядок при work_mem 4 МБ, тобто 768 МБ
# вистачає на ~2 млн записів — більше, ніж рік журналу групи з 40 студентів
# (1,5 млн, docs/08-scale.md), і більше, ніж фронт узагалі здатен утримати в
# памʼяті. Екрани читають агрегати obs.activity_buckets (9 МБ на рік) і до
# цієї межі не наближаються навіть близько.
# Зверху — 4 ГБ RAM і спільний том із WAL: одна сесія не має права з'їсти
# більше, ніж укладається у вільне місце разом із max_wal_size.
temp_file_limit = 768MB

# --- паралелізм і JIT --------------------------------------------------------
# На таблицях у десятки тисяч рядків паралельний план і JIT — чиста витрата
# памʼяті й часу запуску. Вимкнено свідомо, не за замовчуванням.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 1
jit = off

# --- WAL і контрольні точки --------------------------------------------------
wal_level = replica
wal_compression = lz4
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

# --- офсайт-архів WAL (wal-g → S3-сумісне сховище), ADR-022 ------------------
# archive_mode рендерить entrypoint.sh: `on`, якщо заданий WALG_S3_PREFIX,
# інакше `off`. Прибивати `on` у файлі не можна — параметр вимагає перезапуску,
# а archive_command без сховища накопичував би WAL до заповнення диска.
archive_mode = ${ARCHIVE_MODE}
archive_command = '/usr/local/bin/walg-archive.sh %p'
# Стеля втрати при повній втраті машини: сегмент дописується примусово раз на
# чверть години навіть у тиші. Порожній сегмент після lz4 важить кілька КБ,
# тож ціна цієї гарантії — десятки МБ на місяць, а не 1,5 ГБ на добу.
archive_timeout = 15min

# --- планувальник ------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# PG 18 має новий асинхронний ввід-вивід. Значення за замовчуванням (worker)
# для нашого профілю навантаження достатнє; io_uring вмикати лише після заміру.
# io_method = worker

# --- журналювання ------------------------------------------------------------
# Журнал запитів веде pgproxy. Серверний лог — виключно експлуатаційний,
# тому log_min_duration_statement вимкнено: дублювати запити тут не треба.
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = -1
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 250ms
log_min_error_statement = panic

# --- обслуговування ----------------------------------------------------------
autovacuum = on
# Кожен воркер може взяти до maintenance_work_mem; при 4 ГБ тримаємо двох.
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
track_io_timing = on

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

datestyle = 'iso, dmy'
timezone = 'Europe/Kyiv'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.simple'
